  --font-head: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 16px;
  --max: 1040px;
  --pad: clamp(1.25rem, 5vw, 3rem);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  margin: 0; color: var(--ink);
  font: 400 1.0625rem/1.65 var(--font-body);
  background:
    radial-gradient(rgba(122, 172, 255, .14) 1px, transparent 1.5px) 0 0 / 26px 26px,
    radial-gradient(900px 500px at 85% 35%, rgba(27, 111, 224, .18), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0; }
p { margin: 0 0 1em; max-width: 68ch; }
a { color: var(--highlight); }
:focus-visible { outline: 3px solid var(--highlight); outline-offset: 3px; }
ul, ol { padding: 0; margin: 0; list-style: none; }

/* ---------- Nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: .85rem var(--pad);
  background: rgba(var(--bg-rgb), .78);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.nav__logo { font: 800 1.05rem var(--font-head); color: var(--ink); text-decoration: none; }
#nav-links { display: flex; gap: 1.25rem; overflow-x: auto; }
#nav-links a { color: var(--muted); text-decoration: none; font-size: .95rem; white-space: nowrap; }
#nav-links a:hover, #nav-links a.is-active { color: var(--highlight); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }

/* ---------- Layout ---------- */
main > section { max-width: var(--max); margin-inline: auto; padding-inline: var(--pad); }
.section { padding-block: clamp(3rem, 8vw, 5.5rem); border-top: 1px solid var(--line); }
.section:empty { display: none; }

/* Section titles carry a small bar-chart mark */
h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin-bottom: 1.75rem; display: flex; align-items: center; gap: .85rem; }
h2::before {
  content: ""; flex: none; width: 1.7rem; height: 1.7rem;
  background:
    linear-gradient(var(--accent), var(--accent)) 0 100% / .4rem 45% no-repeat,
    linear-gradient(var(--highlight), var(--highlight)) 50% 100% / .4rem 75% no-repeat,
    linear-gradient(var(--accent-strong), var(--accent-strong)) 100% 100% / .4rem 100% no-repeat;
}

/* ---------- Hero (banner as background) ---------- */
main > .hero {
  max-width: none; margin: 0;
  min-height: clamp(470px, 66vh, 660px);
  display: grid; grid-template-columns: minmax(0, 560px) 1fr; align-items: center;
  padding-block: clamp(3rem, 9vw, 6rem);
  padding-inline: max(var(--pad), calc((100vw - var(--max)) / 2 + var(--pad)));
  background:
    linear-gradient(90deg, var(--bg) 0%, var(--bg) 40%, rgba(var(--bg-rgb), 0) 68%),
    linear-gradient(0deg, var(--bg) 0%, var(--bg) 14%, rgba(var(--bg-rgb), 0) 46%),
    var(--hero-image) right center / cover no-repeat var(--bg);
}
.hero__loc { color: var(--highlight); margin-bottom: .75rem; font-weight: 500; }
.hero h1 { font-size: clamp(2.3rem, 6.5vw, 4.4rem); font-weight: 800; letter-spacing: .01em; text-transform: uppercase; }
.hero__role {
  font: 700 clamp(1.05rem, 2.4vw, 1.4rem) var(--font-head); letter-spacing: .18em;
  text-transform: uppercase; color: var(--accent); margin: .8rem 0 1.1rem;
}
.hero__tag {
  color: var(--ink); font-size: 1.2rem; padding-left: 1rem;
  border-left: 4px solid var(--accent); max-width: 30ch;
}
.hero__cta { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.75rem; }
.hero__photo {
  justify-self: end; width: min(260px, 40vw); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
  border: 3px solid var(--accent); box-shadow: 0 0 0 8px rgba(74, 168, 240, .18), 0 20px 50px rgba(0, 0, 0, .5);
}
.hero__photo img { width: 100%; height: 100%; object-fit: cover; }

.btn {
  display: inline-block; padding: .75rem 1.4rem; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent-strong), var(--accent));
  color: var(--on-accent); text-decoration: none; font-weight: 700;
  border: 2px solid transparent; transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(27, 111, 224, .45); }
.btn--ghost { background: transparent; color: var(--highlight); border-color: var(--accent); }
.btn--sm { padding: .45rem 1rem; font-size: .9rem; display: inline-flex; align-items: center; gap: .45rem; }

/* ---------- About ---------- */
.about { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2.5rem; }
.facts { margin: 0; display: grid; gap: 1rem; align-content: start; border-left: 3px solid var(--accent); padding-left: 1.25rem; }
.facts dt { font-size: .85rem; color: var(--muted); }
.facts dd { margin: 0; font-weight: 700; }

/* ---------- Timeline ---------- */
.timeline { border-left: 2px solid var(--line); margin-left: .4rem; }
.timeline > li { position: relative; padding: 0 0 2.25rem 1.75rem; }
.timeline > li::before {
  content: ""; position: absolute; left: -.55rem; top: .45rem; width: 1rem; height: 1rem;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--bg);
  box-shadow: 0 0 0 4px rgba(74, 168, 240, .25);
}
.timeline__period { font-size: .9rem; color: var(--muted); }
.timeline h3 { font-size: 1.25rem; margin: .15rem 0 .5rem; }
.timeline h3 small { display: block; font: 500 1rem var(--font-body); color: var(--highlight); }
.timeline li ul { list-style: disc; padding-left: 1.2rem; color: var(--muted); }

/* ---------- Cards / tags ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.25rem; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.5rem; display: flex; flex-direction: column; backdrop-filter: blur(6px);
  border-top: 3px solid var(--accent);
}
.card h3 { font-size: 1.2rem; margin-bottom: .6rem; }
.card p { color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.tags li { font-size: .85rem; padding: .25rem .7rem; border-radius: 999px; border: 1px solid var(--line); background: rgba(74, 168, 240, .08); }

/* ---------- Projects ---------- */
.project__top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .6rem; }
.project__top h3 { margin: 0; }
.project__date { color: var(--highlight); font-size: .85rem; white-space: nowrap; }
.project__links { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: auto; }

/* ---------- Skill chips with icons ---------- */
.chip { display: inline-flex; align-items: center; gap: .45rem; }
.chip:has(.chip__icon) { padding-left: .4rem; }
.chip__icon { width: 1.45rem; height: 1.45rem; border-radius: 6px; background: #fff; display: grid; place-items: center; flex: none; }
.chip__icon img { width: 1rem; height: 1rem; object-fit: contain; }

/* ---------- Skills / Education ---------- */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.75rem; }
.skills h3 { font-size: 1.05rem; margin-bottom: .75rem; color: var(--highlight); }
.edu li { display: grid; grid-template-columns: 2fr 2fr auto; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.edu span, .edu em { color: var(--muted); font-style: normal; }

/* ---------- Diplomas / Certifications ---------- */
.card__img { width: 100%; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--line); }
.card .meta { color: var(--highlight); font-weight: 700; font-size: .92rem; }
.card__head { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
.card__head h3 { margin-bottom: .15rem; }
.card__head .meta { margin: 0; }
.certs li {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.25rem; margin-bottom: .75rem;
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--accent); border-radius: var(--radius);
}
.certs__text { flex: 1; }
.certs strong, .certs span, .certs small { display: block; }
.certs span, .certs small { color: var(--muted); font-size: .92rem; }
.certs a { margin-left: auto; font-weight: 700; white-space: nowrap; }

/* ---------- Logos ---------- */
.logo {
  flex: none; width: 3.25rem; height: 3.25rem; border-radius: 12px;
  background: #fff; border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden;
}
.logo img { width: 100%; height: 100%; object-fit: contain; padding: .35rem; }
.logo--ini { background: linear-gradient(135deg, var(--accent-strong), var(--accent)); color: var(--on-accent); font: 700 1.05rem var(--font-head); }

/* ---------- Contact / Footer ---------- */
.contact__text { color: var(--muted); font-size: 1.15rem; }
.footer { text-align: center; color: var(--muted); font-size: .9rem; padding: 2rem var(--pad); border-top: 1px solid var(--line); }

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  main > .hero {
    grid-template-columns: 1fr;
    background:
      linear-gradient(180deg, rgba(var(--bg-rgb), .9) 0%, rgba(var(--bg-rgb), .8) 60%, var(--bg) 100%),
      var(--hero-image) 75% center / cover no-repeat var(--bg);
  }
  .hero__photo { justify-self: start; margin-top: 1.5rem; }
  .about { grid-template-columns: 1fr; }
  .edu li { grid-template-columns: 1fr; gap: .15rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; } .btn { transition: none; }
}

  const $ = (id) => document.getElementById(id);
  const esc = (s = "") =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  document.title = d.siteTitle;

    ["about", "About", !!d.about],
    ["experience", "Experience", has(d.experience)],
    ["projects", "Projects", has(d.projects)],
    ["skills", "Skills", has(d.skills)],
    ["education", "Education", has(d.education)],
    ["diplomas", "Diplomas", has(d.diplomas)],
    ["certifications", "Certifications", has(d.certifications)],
    ["contact", "Contact", !!d.contact]
  ];

  // Nav
  $("logo").textContent = d.person.name;

    .join("");

  // Hero

  $("hero").innerHTML = `
    <div class="hero__text">
      <p class="hero__loc">${esc(p.location)}</p>
      <h1>${esc(p.name)}</h1>
      <p class="hero__role">${esc(p.role)}</p>
      <p class="hero__tag">${esc(p.tagline)}</p>
      <div class="hero__cta">
        <a class="btn" href="#contact">Get in touch</a>
        ${p.cvUrl ? `<a class="btn btn--ghost" href="${esc(p.cvUrl)}" download>Download CV</a>` : ""}

    ${p.photo ? `<div class="hero__photo"><img src="${esc(p.photo)}" alt="Portrait of ${esc(p.name)}"></div>` : ""}`;

  // Logo badge: image if provided, otherwise initials of the organization
  const badge = (src, name) => {
    const ini = esc(String(name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase());
    return src
      ? `<span class="logo"><img src="${esc(src)}" alt="${esc(name)} logo" loading="lazy" data-ini="${ini}"></span>`
      : `<span class="logo logo--ini" aria-hidden="true">${ini}</span>`;

  // Helper for section heading

      </div>`;

          ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">Verify</a>` : ""}
        </li>`).join("")}</ul>`;
  }

  // Contact
  if (d.contact) {
    const c = d.contact;
    $("contact").innerHTML = `${head(c.title)}
      <p class="contact__text">${esc(c.text)}</p>
      <div class="hero__cta">
        ${c.email ? `<a class="btn" href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ""}
        ${(c.links || []).map((l) => `<a class="btn btn--ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}
      </div>`;
  }

  document.querySelectorAll(".chip__icon img").forEach((img) =>
    img.addEventListener("error", () => img.parentElement.remove())
  );

  // If a logo file is missing, fall back to initials
  document.querySelectorAll(".logo img").forEach((img) =>
    img.addEventListener("error", () => {
      img.parentElement.classList.add("logo--ini");
      img.parentElement.textContent = img.dataset.ini;
    })
  );

  $("footer").textContent = `© ${new Date().getFullYear()} ${d.person.name}`;

  // Highlight the current nav link while scrolling
  const links = [...document.querySelectorAll("#nav-links a")];
  const io = new IntersectionObserver(
    (entries) => entries.forEach((en) => {
      if (en.isIntersecting) links.forEach((a) => a.classList.toggle("is-active", a.getAttribute("href") === "#" + en.target.id));
    }),
    { rootMargin: "-40% 0px -55% 0px" }
  );
  sections.forEach((s) => { const el = $(s[0]); if (el && el.innerHTML.trim()) io.observe(el); });
})();

</script>
</body>
</html>
